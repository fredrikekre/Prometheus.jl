---
name: Test
on:
  push:
    branches:
      - 'master'
      - 'release-'
    tags: ['*']
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - HTTP ${{ matrix.http }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        version:
          - '1.10'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
        http:
          - 'latest'
        include:
          - os: windows-latest
            version: '1'
            http: 'latest'
          - os: macOS-latest
            version: '1'
            http: 'latest'
          # HTTP.jl 1.x is still allowed by [compat], but the resolver picks the
          # latest major version by default, so test it explicitly.
          - os: ubuntu-latest
            version: '1.10'
            http: '1'
          - os: ubuntu-latest
            version: '1'
            http: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Restrict HTTP.jl version
        if: matrix.http != 'latest'
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.compat("HTTP", "${{ matrix.http }}")
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          plugins: noop
          disable_search: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
